<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Matching Cards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Pokémon Matching Cards</h1>
  <p><strong>how 2 play:</strong> enter an even number of cards in the input section! max is 20. <br>click two cards to
    see
    if they match. if
    they don't, they flip back. if they do, they stay flipped! <br><strong>flip all the cards to WIN!!</strong></p>
  <form class="poke-submit" action="javascript:void(0)">
    <input type="number" placeholder="enter # of cards" id="card-input" step="2" min="2" max="20">
    <button type="submit" id="card-submit">play!</button>
  </form>
  <div id="cards" class="cards">
  </div>
  <p>made for the Hack Club YSWS Hackachu!!</p>
  <script src="script.js"></script>
</body>

</html>
